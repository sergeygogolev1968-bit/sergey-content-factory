<text x="64" y="566" font-family="Arial,Helvetica,sans-serif" font-size="32px" font-weight="400" fill="#A6AAAB">Но цифры показали другое.</text><text x="64" y="612" font-family="Arial,Helvetica,sans-serif" font-size="32px" font-weight="400" fill="#A6AAAB">Сам факт публикации ничего не гарантирует.</text>
