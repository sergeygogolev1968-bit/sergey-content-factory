<text x="64" y="260" font-family="Arial,Helvetica,sans-serif" font-size="72px" font-weight="800" fill="#F3F1EA">СНАЧАЛА Я ДУМАЛ:</text><text x="64" y="342" font-family="Arial,Helvetica,sans-serif" font-size="72px" font-weight="800" fill="#F3F1EA">НАДО ПРОСТО</text><text x="64" y="424" font-family="Arial,Helvetica,sans-serif" font-size="72px" font-weight="800" fill="#F3F1EA">БОЛЬШЕ ПУБЛИКОВАТЬ.</text>
