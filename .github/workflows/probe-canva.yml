name: Probe Canva Image URL
on:
  push:
    paths:
      - canva-probe.json
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Probe original and resized URLs
        shell: bash
        run: |
          set -euo pipefail
          url="$(jq -r '.url' canva-probe.json)"
          mod="$(printf '%s' "$url" | sed 's/height:200/height:1350/; s/width:160/width:1080/; s/quality:75/quality:90/; s/&x-canva-quality=thumbnail//')"
          echo "ORIGINAL=$url"
          echo "MODIFIED=$mod"
          for kind in original modified; do
            if [ "$kind" = original ]; then u="$url"; else u="$mod"; fi
            code="$(curl -L -sS -o "$kind.jpg" -w '%{http_code}' "$u" || true)"
            echo "$kind HTTP=$code bytes=$(wc -c < "$kind.jpg" 2>/dev/null || echo 0)"
            file "$kind.jpg" || true
            python3 - "$kind.jpg" <<'PY'
import sys
from PIL import Image
p=sys.argv[1]
try:
    im=Image.open(p)
    print(p, im.size, im.format)
except Exception as e:
    print(p, "ERROR", e)
PY
          done
