name: Decode Carousel Package
on:
  push:
    paths:
      - 'incoming/*.ready'

permissions:
  contents: write

jobs:
  decode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Decode base64 package
        shell: bash
        run: |
          set -euo pipefail
          ready="$(git diff-tree --no-commit-id --name-only -r "$GITHUB_SHA" | grep -E '^incoming/carousel_[0-9]+\.ready$' | head -n1)"
          id="$(basename "$ready" .ready)"
          dir="incoming/${id}.b64"
          test -d "$dir"
          cat "$dir"/part_* > "/tmp/${id}.b64"
          base64 -d "/tmp/${id}.b64" > "incoming/${id}.zip"
          unzip -t "incoming/${id}.zip"

      - name: Commit binary package
        shell: bash
        run: |
          set -euo pipefail
          ready="$(git diff-tree --no-commit-id --name-only -r "$GITHUB_SHA" | grep -E '^incoming/carousel_[0-9]+\.ready$' | head -n1)"
          id="$(basename "$ready" .ready)"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "incoming/${id}.zip"
          git commit -m "Decode ${id} package"
          git push
