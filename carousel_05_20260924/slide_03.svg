<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350"><rect width="1080" height="1350" fill="#071018"/><rect width="1080" height="14" fill="#FF7A00"/><rect x="64" y="78" width="110" height="8" rx="4" fill="#FF7A00"/><text x="64" y="126" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700" fill="#FF7A00">SERGEY KORNEEV</text><text x="1016" y="126" text-anchor="end" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700" fill="#A6AAAB">03</text><text x="64" y="260" font-family="Arial,Helvetica,sans-serif" font-size="60" font-weight="800" fill="#F3F1EA">ГДЕ ЛЮДИ</text><text x="64" y="330" font-family="Arial,Helvetica,sans-serif" font-size="60" font-weight="800" fill="#FF7A00">УХОДЯТ?</text><text x="64" y="395" font-family="Arial,Helvetica,sans-serif" font-size="29" fill="#F3F1EA">Если это Reels — смотрим удержание.</text><text x="64" y="435" font-family="Arial,Helvetica,sans-serif" font-size="29" fill="#F3F1EA">Если карусель — до какого слайда доходят.</text><rect x="64" y="500" width="952" height="370" rx="22" fill="#0A1117" stroke="#26323A" stroke-width="2"/><text x="96" y="545" font-family="Arial,Helvetica,sans-serif" font-size="29" font-weight="700" fill="#F3F1EA">Удержание аудитории</text><line x1="110" y1="790" x2="960" y2="790" stroke="#53606A" stroke-width="2"/><line x1="110" y1="620" x2="110" y2="790" stroke="#53606A" stroke-width="2"/><polyline points="110,640 260,675 430,720 610,760 780,785 960,790" fill="none" stroke="#FF7A00" stroke-width="6"/><circle cx="610" cy="760" r="12" fill="#FF7A00"/><text x="650" y="700" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="700" fill="#FF7A00">Здесь чаще</text><text x="650" y="733" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="700" fill="#FF7A00">всего уходят</text><text x="64" y="930" font-family="Arial,Helvetica,sans-serif" font-size="28" fill="#F3F1EA">Если большинство не добирается до сути,</text><text x="64" y="970" font-family="Arial,Helvetica,sans-serif" font-size="28" fill="#F3F1EA">проблема может быть в начале.</text><rect x="64" y="1135" width="952" height="105" rx="20" fill="#FF7A00"/><text x="96" y="1198" font-family="Arial,Helvetica,sans-serif" font-size="30" font-weight="800" fill="#071018">ПЕРВЫЙ ЭКРАН — НЕ ДЕКОРАЦИЯ.</text></svg>