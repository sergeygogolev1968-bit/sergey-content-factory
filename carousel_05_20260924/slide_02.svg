<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350"><rect width="1080" height="1350" fill="#071018"/><rect width="1080" height="14" fill="#FF7A00"/><rect x="64" y="78" width="110" height="8" rx="4" fill="#FF7A00"/><text x="64" y="126" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700" fill="#FF7A00">SERGEY KORNEEV</text><text x="1016" y="126" text-anchor="end" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700" fill="#A6AAAB">02</text><text x="64" y="260" font-family="Arial,Helvetica,sans-serif" font-size="58" font-weight="800" fill="#F3F1EA">НЕ СМОТРЕЛ БЫ</text><text x="64" y="326" font-family="Arial,Helvetica,sans-serif" font-size="58" font-weight="800" fill="#F3F1EA">ТОЛЬКО НА</text><text x="64" y="392" font-family="Arial,Helvetica,sans-serif" font-size="58" font-weight="800" fill="#FF7A00">ПРОСМОТРЫ</text><text x="64" y="450" font-family="Arial,Helvetica,sans-serif" font-size="30" fill="#A6AAAB">Просмотры — это только первый сигнал.</text><text x="64" y="492" font-family="Arial,Helvetica,sans-serif" font-size="30" fill="#F3F1EA">Я бы смотрел дальше:</text><rect x="64" y="535" width="952" height="70" rx="18" fill="#0A1117" stroke="#26323A" stroke-width="2"/><text x="98" y="580" font-family="Arial,Helvetica,sans-serif" font-size="29" font-weight="700" fill="#F3F1EA">Досмотры</text><circle cx="965" cy="570" r="10" fill="#FF7A00"/><rect x="64" y="627" width="952" height="70" rx="18" fill="#0A1117" stroke="#26323A" stroke-width="2"/><text x="98" y="672" font-family="Arial,Helvetica,sans-serif" font-size="29" font-weight="700" fill="#F3F1EA">Реакции</text><circle cx="965" cy="662" r="10" fill="#FF7A00"/><rect x="64" y="719" width="952" height="70" rx="18" fill="#0A1117" stroke="#26323A" stroke-width="2"/><text x="98" y="764" font-family="Arial,Helvetica,sans-serif" font-size="29" font-weight="700" fill="#F3F1EA">Сохранения</text><circle cx="965" cy="754" r="10" fill="#FF7A00"/><rect x="64" y="811" width="952" height="70" rx="18" fill="#0A1117" stroke="#26323A" stroke-width="2"/><text x="98" y="856" font-family="Arial,Helvetica,sans-serif" font-size="29" font-weight="700" fill="#F3F1EA">Переходы</text><circle cx="965" cy="846" r="10" fill="#FF7A00"/><rect x="64" y="903" width="952" height="70" rx="18" fill="#0A1117" stroke="#26323A" stroke-width="2"/><text x="98" y="948" font-family="Arial,Helvetica,sans-serif" font-size="29" font-weight="700" fill="#F3F1EA">Подписки</text><circle cx="965" cy="938" r="10" fill="#FF7A00"/><text x="64" y="1035" font-family="Arial,Helvetica,sans-serif" font-size="28" fill="#F3F1EA">Потому что просмотры сами по себе не объясняют,</text><text x="64" y="1075" font-family="Arial,Helvetica,sans-serif" font-size="28" fill="#F3F1EA">что сработало.</text></svg>