<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350"><rect width="1080" height="1350" fill="#071018"/><rect width="1080" height="14" fill="#FF7A00"/><rect x="64" y="78" width="110" height="8" rx="4" fill="#FF7A00"/><text x="64" y="126" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700" fill="#FF7A00">SERGEY KORNEEV</text><text x="1016" y="126" text-anchor="end" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700" fill="#A6AAAB">05</text><text x="64" y="260" font-family="Arial,Helvetica,sans-serif" font-size="56" font-weight="800" fill="#F3F1EA">ЧТО СОХРАНЯЮТ</text><text x="64" y="328" font-family="Arial,Helvetica,sans-serif" font-size="56" font-weight="800" fill="#FF7A00">И ОТПРАВЛЯЮТ?</text><text x="64" y="390" font-family="Arial,Helvetica,sans-serif" font-size="30" fill="#A6AAAB">Это для меня важнее простого лайка.</text><rect x="64" y="465" width="952" height="245" rx="22" fill="#0A1117" stroke="#26323A" stroke-width="2"/><text x="96" y="520" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="800" fill="#F3F1EA">Сохранения — 248</text><text x="96" y="590" font-family="Arial,Helvetica,sans-serif" font-size="54" font-weight="900" fill="#FF7A00">+120%</text><rect x="64" y="750" width="952" height="245" rx="22" fill="#0A1117" stroke="#26323A" stroke-width="2"/><text x="96" y="805" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="800" fill="#F3F1EA">Отправки — 97</text><text x="96" y="875" font-family="Arial,Helvetica,sans-serif" font-size="54" font-weight="900" fill="#FF7A00">+340%</text><text x="64" y="1050" font-family="Arial,Helvetica,sans-serif" font-size="27" fill="#F3F1EA">Если человек сохранил пост — он увидел в нём пользу.</text><text x="64" y="1090" font-family="Arial,Helvetica,sans-serif" font-size="27" fill="#F3F1EA">Если отправил другому — тема оказалась достаточно важной,</text><text x="64" y="1130" font-family="Arial,Helvetica,sans-serif" font-size="27" fill="#F3F1EA">чтобы поделиться.</text></svg>