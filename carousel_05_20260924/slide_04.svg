<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350"><rect width="1080" height="1350" fill="#071018"/><rect width="1080" height="14" fill="#FF7A00"/><rect x="64" y="78" width="110" height="8" rx="4" fill="#FF7A00"/><text x="64" y="126" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700" fill="#FF7A00">SERGEY KORNEEV</text><text x="1016" y="126" text-anchor="end" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700" fill="#A6AAAB">04</text><text x="64" y="260" font-family="Arial,Helvetica,sans-serif" font-size="60" font-weight="800" fill="#F3F1EA">СРАВНИЛ БЫ</text><text x="64" y="330" font-family="Arial,Helvetica,sans-serif" font-size="60" font-weight="800" fill="#FF7A00">ОБЛОЖКИ</text><text x="64" y="395" font-family="Arial,Helvetica,sans-serif" font-size="30" fill="#F3F1EA">После 10 публикаций уже можно увидеть закономерности.</text><rect x="64" y="480" width="952" height="420" rx="22" fill="#0A1117" stroke="#26323A" stroke-width="2"/><text x="96" y="535" font-family="Arial,Helvetica,sans-serif" font-size="30" font-weight="800" fill="#F3F1EA">Что открывают?</text><text x="110" y="650" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="800" fill="#FF7A00">01</text><text x="180" y="650" font-family="Arial,Helvetica,sans-serif" font-size="30" font-weight="700" fill="#F3F1EA">Что пролистывают?</text><text x="110" y="760" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="800" fill="#FF7A00">02</text><text x="180" y="760" font-family="Arial,Helvetica,sans-serif" font-size="30" font-weight="700" fill="#F3F1EA">Что проходят мимо?</text><rect x="64" y="1000" width="952" height="170" rx="22" fill="#0A1117" stroke="#26323A" stroke-width="2"/><text x="96" y="1060" font-family="Arial,Helvetica,sans-serif" font-size="38" font-weight="800" fill="#F3F1EA">НЕ УГАДЫВАТЬ.</text><text x="96" y="1125" font-family="Arial,Helvetica,sans-serif" font-size="48" font-weight="800" fill="#FF7A00">СРАВНИВАТЬ.</text></svg>