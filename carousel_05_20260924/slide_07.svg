<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350"><rect width="1080" height="1350" fill="#071018"/><rect width="1080" height="14" fill="#FF7A00"/><rect x="64" y="78" width="110" height="8" rx="4" fill="#FF7A00"/><text x="64" y="126" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700" fill="#FF7A00">SERGEY KORNEEV</text><text x="1016" y="126" text-anchor="end" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700" fill="#A6AAAB">07</text><text x="64" y="280" font-family="Arial,Helvetica,sans-serif" font-size="54" font-weight="800" fill="#F3F1EA">10 ПУБЛИКАЦИЙ —</text><text x="64" y="346" font-family="Arial,Helvetica,sans-serif" font-size="54" font-weight="800" fill="#F3F1EA">ЭТО ЕЩЁ НЕ</text><text x="64" y="412" font-family="Arial,Helvetica,sans-serif" font-size="54" font-weight="800" fill="#FF7A00">РЕЗУЛЬТАТ.</text><text x="64" y="475" font-family="Arial,Helvetica,sans-serif" font-size="30" fill="#A6AAAB">Это первые данные.</text><rect x="64" y="545" width="952" height="300" rx="22" fill="#0A1117" stroke="#26323A" stroke-width="2"/><text x="110" y="610" font-family="Arial,Helvetica,sans-serif" font-size="30" font-weight="800" fill="#F3F1EA">→ Контент</text><text x="110" y="670" font-family="Arial,Helvetica,sans-serif" font-size="30" font-weight="800" fill="#F3F1EA">→ Цифры</text><text x="110" y="730" font-family="Arial,Helvetica,sans-serif" font-size="30" font-weight="800" fill="#F3F1EA">→ Вывод</text><text x="110" y="790" font-family="Arial,Helvetica,sans-serif" font-size="30" font-weight="800" fill="#F3F1EA">→ Следующий тест</text><text x="64" y="930" font-family="Arial,Helvetica,sans-serif" font-size="28" fill="#F3F1EA">Именно так я сейчас строю свой блог.</text><text x="64" y="1005" font-family="Arial,Helvetica,sans-serif" font-size="27" font-weight="700" fill="#F3F1EA">А ты после публикации смотришь на цифры</text><text x="64" y="1045" font-family="Arial,Helvetica,sans-serif" font-size="27" font-weight="700" fill="#F3F1EA">или просто выкладываешь следующий пост?</text></svg>