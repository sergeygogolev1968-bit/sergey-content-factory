<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350"><rect width="1080" height="1350" fill="#071018"/><rect width="1080" height="14" fill="#FF7A00"/><rect x="64" y="78" width="110" height="8" rx="4" fill="#FF7A00"/><text x="64" y="126" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700" fill="#FF7A00">SERGEY KORNEEV</text><text x="1016" y="126" text-anchor="end" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700" fill="#A6AAAB">06</text><text x="64" y="260" font-family="Arial,Helvetica,sans-serif" font-size="56" font-weight="800" fill="#F3F1EA">НЕ МЕНЯТЬ</text><text x="64" y="328" font-family="Arial,Helvetica,sans-serif" font-size="56" font-weight="800" fill="#FF7A00">ВСЁ СРАЗУ</text><text x="64" y="390" font-family="Arial,Helvetica,sans-serif" font-size="28" fill="#F3F1EA">Здесь легко ошибиться. Получил слабые цифры —</text><text x="64" y="430" font-family="Arial,Helvetica,sans-serif" font-size="28" fill="#F3F1EA">и хочется поменять всё: темы, стиль, формат, подачу…</text><rect x="64" y="490" width="952" height="600" rx="22" fill="#0A1117" stroke="#26323A" stroke-width="2"/><text x="96" y="545" font-family="Arial,Helvetica,sans-serif" font-size="30" font-weight="800" fill="#F3F1EA">Как правильно тестировать:</text><text x="100" y="650" font-family="Arial,Helvetica,sans-serif" font-size="30" font-weight="800" fill="#FF7A00">1. Гипотеза</text><text x="390" y="650" font-family="Arial,Helvetica,sans-serif" font-size="28" fill="#F3F1EA">(что меняю?)</text><text x="100" y="760" font-family="Arial,Helvetica,sans-serif" font-size="30" font-weight="800" fill="#FF7A00">2. Тест</text><text x="390" y="760" font-family="Arial,Helvetica,sans-serif" font-size="28" fill="#F3F1EA">(1 элемент)</text><text x="100" y="870" font-family="Arial,Helvetica,sans-serif" font-size="30" font-weight="800" fill="#FF7A00">3. Цифры</text><text x="390" y="870" font-family="Arial,Helvetica,sans-serif" font-size="28" fill="#F3F1EA">(смотрю результат)</text><text x="100" y="980" font-family="Arial,Helvetica,sans-serif" font-size="30" font-weight="800" fill="#FF7A00">4. Вывод</text><text x="390" y="980" font-family="Arial,Helvetica,sans-serif" font-size="28" fill="#F3F1EA">(решаю, что дальше)</text><rect x="64" y="1150" width="952" height="105" rx="20" fill="#FF7A00"/><text x="96" y="1214" font-family="Arial,Helvetica,sans-serif" font-size="32" font-weight="800" fill="#071018">ОДИН ЭЛЕМЕНТ ЗА РАЗ!</text></svg>