<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350"><rect width="1080" height="1350" fill="#071018"/><rect width="1080" height="18" fill="#FF7A00"/><rect x="64" y="84" width="110" height="8" rx="4" fill="#FF7A00"/><text x="64" y="160" font-family="Arial,Helvetica,sans-serif" font-size="24px" font-weight="700" fill="#FF7A00">SERGEY KORNEEV</text><text x="1016" y="160" text-anchor="end" font-family="Arial,Helvetica,sans-serif" font-size="24px" fill="#A6AAAB">04</text><text x="64" y="260" font-family="Arial,Helvetica,sans-serif" font-size="60px" font-weight="800" fill="#F3F1EA">ЗНАЧИТ,</text><text x="64" y="330" font-family="Arial,Helvetica,sans-serif" font-size="60px" font-weight="800" fill="#F3F1EA">КАЖДАЯ КАРУСЕЛЬ</text><text x="64" y="400" font-family="Arial,Helvetica,sans-serif" font-size="60px" font-weight="800" fill="#F3F1EA">ДОЛЖНА ДАВАТЬ</text><text x="64" y="470" font-family="Arial,Helvetica,sans-serif" font-size="60px" font-weight="800" fill="#F3F1EA">ПРИЧИНУ ОСТАТЬСЯ.</text><rect x="64" y="742" width="952" height="2" fill="#26323A"/><text x="64" y="600" font-family="Arial,Helvetica,sans-serif" font-size="32px" fill="#A6AAAB">Не «посмотрите мой путь».</text><text x="64" y="646" font-family="Arial,Helvetica,sans-serif" font-size="32px" fill="#A6AAAB">А: «это поможет мне решить мою задачу».</text><rect x="64" y="1215" width="952" height="72" rx="16" fill="#0A1117" stroke="#26323A" stroke-width="2"/><circle cx="101" cy="1251" r="10" fill="#FF7A00"/><text x="128" y="1261" font-family="Arial,Helvetica,sans-serif" font-size="22px" font-weight="700" fill="#F3F1EA">НОВАЯ ГЛАВА · КОНТЕНТ-ЭКСПЕРИМЕНТ</text></svg>