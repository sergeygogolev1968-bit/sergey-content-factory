<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350"><rect width="1080" height="1350" fill="#071018"/><rect width="1080" height="18" fill="#FF7A00"/><rect x="64" y="84" width="110" height="8" rx="4" fill="#FF7A00"/><text x="64" y="160" font-family="Arial,Helvetica,sans-serif" font-size="24px" font-weight="700" fill="#FF7A00">SERGEY KORNEEV</text><text x="1016" y="160" text-anchor="end" font-family="Arial,Helvetica,sans-serif" font-size="24px" fill="#A6AAAB">05</text><text x="64" y="260" font-family="Arial,Helvetica,sans-serif" font-size="72px" font-weight="800" fill="#F3F1EA">4. НЕ ОЦЕНИВАЛ БЫ</text><text x="64" y="342" font-family="Arial,Helvetica,sans-serif" font-size="72px" font-weight="800" fill="#F3F1EA">ПОСТ ПО ЛАЙКАМ.</text><rect x="64" y="718" width="952" height="2" fill="#26323A"/><text x="64" y="484" font-family="Arial,Helvetica,sans-serif" font-size="32px" fill="#A6AAAB">Смотрел бы:</text><text x="64" y="530" font-family="Arial,Helvetica,sans-serif" font-size="32px" fill="#A6AAAB">досмотрели ли,</text><text x="64" y="576" font-family="Arial,Helvetica,sans-serif" font-size="32px" fill="#A6AAAB">сохранили ли,</text><text x="64" y="622" font-family="Arial,Helvetica,sans-serif" font-size="32px" fill="#A6AAAB">подписались ли.</text><rect x="64" y="1215" width="952" height="72" rx="16" fill="#0A1117" stroke="#26323A" stroke-width="2"/><circle cx="101" cy="1251" r="10" fill="#FF7A00"/><text x="128" y="1261" font-family="Arial,Helvetica,sans-serif" font-size="22px" font-weight="700" fill="#F3F1EA">НОВАЯ ГЛАВА · КОНТЕНТ-ЭКСПЕРИМЕНТ</text></svg>