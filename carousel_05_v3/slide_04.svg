<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350"><rect width="1080" height="1350" fill="#12181f"/><rect x="70" y="70" width="110" height="12" rx="6" fill="#f26f2a"/><style>text{font-family:Arial,sans-serif;font-weight:700}</style><text x="70" y="215" font-size="64" fill="#f5f3ee">ВОЗЬМИ ПЕРВЫЕ</text><text x="70" y="315" font-size="82" fill="#f26f2a">10 ПОСТОВ.</text><text x="70" y="450" font-size="43" fill="#b2b7ba">И посмотри:</text><text x="70" y="545" font-size="46" fill="#f5f3ee">Что открывают?</text><text x="70" y="615" font-size="46" fill="#f5f3ee">Что сохраняют?</text><text x="70" y="685" font-size="46" fill="#f5f3ee">Что пролистывают?</text><text x="70" y="820" font-size="52" fill="#f26f2a">Не угадывай.</text><text x="70" y="885" font-size="44" fill="#f5f3ee">Смотри на поведение.</text></svg>