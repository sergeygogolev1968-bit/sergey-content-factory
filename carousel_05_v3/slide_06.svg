<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350"><rect width="1080" height="1350" fill="#12181f"/><rect x="70" y="70" width="110" height="12" rx="6" fill="#f26f2a"/><style>text{font-family:Arial,sans-serif;font-weight:700}</style><text x="70" y="220" font-size="72" fill="#f5f3ee">НЕ МЕНЯЙ</text><text x="70" y="315" font-size="78" fill="#f26f2a">ВСЁ СРАЗУ.</text><text x="70" y="470" font-size="43" fill="#f5f3ee">Изменил обложку →</text><text x="70" y="530" font-size="43" fill="#f5f3ee">посмотрел результат.</text><text x="70" y="635" font-size="43" fill="#f5f3ee">Изменил подачу →</text><text x="70" y="695" font-size="43" fill="#f5f3ee">снова посмотрел.</text><text x="70" y="840" font-size="58" fill="#f26f2a">ОДИН ТЕСТ =</text><text x="70" y="915" font-size="58" fill="#f26f2a">ОДИН ВЫВОД.</text></svg>