<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350"><rect width="1080" height="1350" fill="#12181f"/><rect x="70" y="70" width="110" height="12" rx="6" fill="#f26f2a"/><style>text{font-family:Arial,sans-serif;font-weight:700}</style><text x="70" y="215" font-size="67" fill="#f5f3ee">300 ПРОСМОТРОВ —</text><text x="70" y="305" font-size="70" fill="#f26f2a">ЭТО НЕ ПРОВАЛ.</text><text x="70" y="440" font-size="42" fill="#b2b7ba">Важнее другое:</text><text x="70" y="535" font-size="57" fill="#f5f3ee">ГДЕ ТЫ ПОТЕРЯЛ</text><text x="70" y="625" font-size="72" fill="#f26f2a">ЛЮДЕЙ?</text><text x="70" y="750" font-size="40" fill="#f5f3ee">На обложке? В начале?</text><text x="70" y="815" font-size="40" fill="#f5f3ee">На середине?</text><text x="70" y="940" font-size="42" fill="#f26f2a">Вот это уже интересно.</text></svg>