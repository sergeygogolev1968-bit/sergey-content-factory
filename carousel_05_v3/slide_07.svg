<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350"><rect width="1080" height="1350" fill="#12181f"/><rect x="70" y="70" width="110" height="12" rx="6" fill="#f26f2a"/><style>text{font-family:Arial,sans-serif;font-weight:700}</style><text x="70" y="210" font-size="60" fill="#f5f3ee">ПЕРВЫЕ 10 ПОСТОВ —</text><text x="70" y="305" font-size="74" fill="#f26f2a">НЕ ЭКЗАМЕН.</text><text x="70" y="440" font-size="43" fill="#b2b7ba">Это твои первые данные.</text><text x="70" y="560" font-size="42" fill="#f5f3ee">Не:</text><text x="70" y="630" font-size="48" fill="#f5f3ee">«Я не умею вести блог».</text><text x="70" y="750" font-size="42" fill="#f26f2a">А:</text><text x="70" y="820" font-size="46" fill="#f5f3ee">«Почему здесь сработало,</text><text x="70" y="885" font-size="46" fill="#f5f3ee">а здесь нет?»</text><text x="70" y="1025" font-size="48" fill="#f26f2a">Вот с этого начинается рост.</text></svg>