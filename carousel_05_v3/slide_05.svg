<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350"><rect width="1080" height="1350" fill="#12181f"/><rect x="70" y="70" width="110" height="12" rx="6" fill="#f26f2a"/><style>text{font-family:Arial,sans-serif;font-weight:700}</style><text x="70" y="215" font-size="62" fill="#f5f3ee">ЛАЙК — ЭТО ЕЩЁ</text><text x="70" y="310" font-size="74" fill="#f26f2a">НЕ ПОЛЬЗА.</text><text x="70" y="445" font-size="40" fill="#b2b7ba">Сохранение говорит:</text><text x="70" y="530" font-size="55" fill="#f5f3ee">«Мне пригодится».</text><text x="70" y="660" font-size="40" fill="#b2b7ba">Отправка:</text><text x="70" y="745" font-size="50" fill="#f5f3ee">«Тебе тоже нужно</text><text x="70" y="810" font-size="50" fill="#f5f3ee">это увидеть».</text><text x="70" y="950" font-size="40" fill="#f26f2a">Смотри на эти сигналы.</text></svg>