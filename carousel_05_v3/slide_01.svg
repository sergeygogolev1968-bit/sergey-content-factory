<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350"><rect width="1080" height="1350" fill="#12181f"/><rect x="70" y="70" width="110" height="12" rx="6" fill="#f26f2a"/><style>text{font-family:Arial,sans-serif;font-weight:700}</style><text x="70" y="220" font-size="70" fill="#f5f3ee">ТЫ НАЧАЛ ВЕСТИ</text><text x="70" y="312" font-size="92" fill="#f26f2a">БЛОГ.</text><text x="70" y="470" font-size="46" fill="#f5f3ee">10 постов.</text><text x="70" y="535" font-size="46" fill="#f5f3ee">187 просмотров.</text><text x="70" y="650" font-size="38" fill="#b2b7ba">И уже мысль:</text><text x="70" y="725" font-size="44" fill="#f5f3ee">«Может, это никому</text><text x="70" y="785" font-size="44" fill="#f5f3ee">не нужно?»</text><text x="70" y="930" font-size="50" fill="#f26f2a">Не спеши.</text></svg>